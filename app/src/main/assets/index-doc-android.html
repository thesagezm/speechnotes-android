<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<style>
  html, body { margin: 0; padding: 0; background: transparent; overflow-x: hidden; }
  /* #content is the doc reader's page: one chapter's XHTML mounts here per
     fetch, and the appearance layer dresses it (docreader.js). min-height
     keeps short chapters tall enough for the scroll-fraction math to hold. */
  #content { width: 100%; box-sizing: border-box; min-height: 100%; }
</style>
</head>
<body>
<div id="content"></div>
<script>
  // Android bridge shim: docreader.js uses the same webkit postMessage shape
  // reader.js does, backed by the shared JS interface.
  window.webkit = {
    messageHandlers: {
      reader: {
        postMessage: function (msg) {
          if (window.AndroidReaderBridge) window.AndroidReaderBridge.post(JSON.stringify(msg));
        }
      }
    }
  };
</script>
<script src="docreader.js"></script>
</body>
</html>
